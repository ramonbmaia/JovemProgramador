<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <!-- SCRIPT -->
    <script>
        const texto = document.getElementById("meuInput").value;

        function processar() {
            const valor = document.getElementById("meuInput").value;
            document.getElementById("resultado").innerHTML = valor;
        }

        document.getElementById("resultado").innerHTML = "Olá " + document.getElementById("meuInput").value + "!";
    </script>
    <!-- CSS -->
    <style>
        body {
            text-align: center;
            padding: 15px;
        }

        input {
            background-color: black;
            color: white;
            padding: 5px 5px 5px 5px;
            border-radius: 50px;
            border: none;
            font-size: 12px;
        }

        button {
            background-color: red;
            color: white;
            padding: 5px 5px 5px 5px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 12px;
        }

        hr {
            border: 1px dashed black;
            margin: 15px 0;
        }

        #resultado {
            font-size: 20px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- INPUT -->
        <input id="meuInput" type="text">
    <!-- BOTÃO -->
        <button id="meuBotao" onclick="processar()">OK</button>
    <!-- LINHA DIVISÓRIA -->
        <hr>
    <!-- RESULTADO -->
        <div id="resultado">O resultado aparece aqui!</div>
</body>
</html>
