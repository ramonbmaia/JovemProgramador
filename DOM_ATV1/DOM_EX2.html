<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULADORA</title>
    <!--INÍCIO DO SCRIPT-->
    <script>
        function somar() {
            const n1 = parseFloat(document.getElementById("input1").value);
            const n2 = parseFloat(document.getElementById("input2").value);
            const soma = n1 + n2
            document.getElementById("resultado").innerHTML = soma;
        }
        function dividir() {
            const n1 = parseFloat(document.getElementById("input1").value);
            const n2 = parseFloat(document.getElementById("input2").value);
            const dividir = n1 / n2
            document.getElementById("resultado").innerHTML = dividir
        }
        function multiplicar() {
            const n1 = parseFloat(document.getElementById("input").value);
            const n2 = parseFloat(document.getElementById("input2").value);
            const multiplicar = n1 * n2
            document.getElementById("resultado").innerHTML = multiplicar
        }
        function subtrair() {
            const n1 = parseFloat(document.getElementById("input1").value);
            const n2 = parseFloat(document.getElementById("input2").value);
            const subtrair = n1 - n2
            document.getElementById("resultado").innerHTML = subtrair;
        }
    </script>
    <!--FIM DO SCRIPT-->
    <!--INÍCIO DO CSS-->
    <style>
        body {
            text-align: center;
            margin: 5% 0;
        }

        h1 {
            font-size: 22px;
            text-transform: uppercase;
        }

        #input1,
        #input2 {
            width: auto;
            border: none;
            border-radius: 50px;
            background-color: #f5f5f5;
            padding: 5px;
        }

        #somar,
        #subtrair {
            border: none;
            width: 50px;
            border-radius: 50px;
            background-color: lightgray;
            padding: 5px;
        }

        #somar:active,
        #subtrair:active {
            background-color: black;
            border: none;
            color: white;
        }

        #resultado {
            margin-top: 10px;
            font-weight: 600;
            font-size: 25px;
        }
    </style>
    <!--FIM DO CSS-->
</head>

<body>
    <h1>Calculadora</h1>
    <!--INPUT 1-->
    <input id="input1" type="number" placeholder="Inserir Número">
    <!--INPUT 2-->
    <input id="input2" type="number" placeholder="Inserir Número">
    <!--BOTÃO DE SOMA-->
    <button id="somar" onclick="somar()">+</button>
    <!--BOTÃO DE SUBTRAÇÃO-->
    <button id="subtrair" onclick="subtrair()">-</button>
    <!--RESULTADO-->
    <div id="resultado">=</div>
</body>

</html>
