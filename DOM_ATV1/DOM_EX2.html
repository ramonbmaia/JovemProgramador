    <style>
        body { text-align: center; margin: 5% 0; }

        #input1, #input2 {
            width: 50px;
            border: none;

        #somar, #subtrair {

        }

        #somar:active, #subtrair:active {

        }

        #resultado {
            margin-top: 10px;
        }
    </style>

    <!--BOTÃO DE SUBTRAÇÃO-->
        <button id="subtrair" onclick="subtrair()">-</button>
