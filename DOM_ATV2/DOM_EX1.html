<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body { text-align: center; font-family: "Montserrat", sans-serif; }
        ::-webkit-scrollbar { display: none; }
        h1 { font-size: 25px; text-transform: uppercase; box-shadow: 5px; }
            h1:hover { color: darkorange; cursor: default; }
        #inputTarefa { padding-left: 10px; background-color: #f5f5f5; border: none; border-radius: 20px; height: 23px; }
        #addTarefa { background-color: #f0f0f0; border: none; border-radius: 20px; height: 24px; }
            #addTarefa:hover { background-color: lightgray; }
                #addTarefa:active { color: white; background-color: black; }
        #listaDeTarefas { overflow: scroll; margin: 25px auto; padding: 5px; width: 25%; height: 200px; background-color: #f5f5f5; border-radius: 20px; font-size: 10px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #listaDeTarefas button { color: white; background-color: crimson; border: none; border-radius: 5px; margin-left: 5px; font-size: 10px; font-family: "Montserrat", sans-serif; font-weight: 600; }
            #listaDeTarefas button:hover { color: white; background-color: red; border: none; border-radius: 5px; margin-left: 5px; font-size: 10px; font-family: "Montserrat", sans-serif; font-weight: 600; }
                #listaDeTarefas button:active { color: white; background-color: black; border: none; border-radius: 5px; margin-left: 5px; font-size: 10px; font-family: "Montserrat", sans-serif; font-weight: 600; }
        li { font-size: 15px; list-style-type: none; margin: 5px 0; padding: 0; }
    </style>
</head>
<body>
    <header>
        <h1>Lista de Tarefas</h1>
    </header>
    <input id="inputTarefa" type="text" placeholder="Insirir a tarefa">
    <button id="addTarefa" onclick="adicionarTarefa()">Adicionar</button>
    <div id="listaDeTarefas"></div>

    <script>
        function adicionarTarefa() {
            const tarefa = inputTarefa.value.trim();
            const li = document.createElement("li");
            const botaoRemover = document.createElement("button");

            botaoRemover.textContent = "X";
            li.textContent = tarefa;
            botaoRemover.onclick = function() {
                li.remove();
            }

            li.appendChild(botaoRemover);
            listaDeTarefas.appendChild(li);
            inputTarefa.value = ""
        }        
    </script>
</body>
</html>
