<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Formulário</title>
    <style>
        body {
            background-color: rgb(8, 11, 54);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        h2 {
            justify-self: center;
            text-transform: uppercase;
            color: white;
        }
        .telaLogin {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 350px;
            height: 200px;
            margin: 0;
            padding: 0;
            background-color: rgb(22, 26, 82);
            justify-self: center;
            align-content: center;
            text-align: center;
            border-radius: 15px;
        }
        label {
            color: white;
            align-content: center;
            font-size: 14px;
            padding: -10px;
        }
        #email, #senha {
            display: block;
            justify-self: center;
            margin: 10px;
            width: 180px;
            height: 25px;
            border-radius: 6px;
            border: 1px solid gray;
            padding-left: 5px;
        }
        #login {
            display: block;
            justify-self: center;
            margin-top: 20px;
            width: 80px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background-color: fuchsia;
            color: white;
        }
        #login:active {
            background-color: cyan;
            color: black;
        }
        #return {
            color: white;
            padding: 5px;
            width: 286px;
            height: 20px;
            justify-self: center;
            margin-top: 10px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h2>Tela de Login</h2>
    </header>
    <div class="telaLogin">
        <label for="email">E-mail:</label>
        <input id="email" type="email" placeholder="exemplo@email.com">
        <label for="email">Senha:</label>
        <input id="senha" type="password" placeholder="Insira a senha">
    </div>
        <button id="login" onclick="login()">Login</button>
    <div>

    </div>
    <div id="return"></div>

    <script>
        //FUNÇÃO LOGIN
        function login() {
            let email = document.getElementById("email").value;
            let senha = document.getElementById("senha").value;

            if (email == "" && senha == "") {
                return(document.getElementById("return").innerText = "Os campos não podem ficar vazios!");
            }
            else if (email == "") {
                return(document.getElementById("return").innerText = "O campo e-mail não pode ficar vazio!");
            }
            else if (senha == "") {
                return(document.getElementById("return").innerText = "O campo senha não pode ficar vazio!");
            }
            else if (!email.includes("@") || !email.includes(".")) {
                return(document.getElementById("return").innerText = " Insira um e-mail válido!");               
            } else {
                document.getElementById("return").innerText = "Login validado com sucesso!";
            }
        }
    </script>
</body>
</html>
